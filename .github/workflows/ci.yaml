name: CI Pipeline

on: push

# jobs:
#   project-testing:
#     runs-on: ubuntu-latest

# name: CI Pipeline

# on: 
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      #Instead of installing all dependencies multiple time due to multiple run, to avoid this we take dependencies from cache and speed up execution after 1-2 execution.
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          CAPSTONE_TEST: ${{ secrets.MLOPS_CAPS_PROJ_DAGS_TOKEN }}
        run: |
          dvc repro

      - name: Run model tests
        env:
          CAPSTONE_TEST: ${{ secrets.MLOPS_CAPS_PROJ_DAGS_TOKEN }}
        run: |
          python -m unittest tests/test_model.py
      
      - name: Run Flask app tests # Moved UP before promotion
        if: success()
        env:
          CAPSTONE_TEST: ${{ secrets.MLOPS_CAPS_PROJ_DAGS_TOKEN }}
        run: python -m unittest tests/test_flask_app.py

      - name: Promote model to production
        if: success()
        env: #dag auth
          CAPSTONE_TEST: ${{ secrets.MLOPS_CAPS_PROJ_DAGS_TOKEN }}
        run: python scripts/promote_model.py

      ## GCP + Docker (only on main branch)
      - name: Authenticate to Google Cloud
        id: auth
        if: success() && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'
          
      - name: Set up Cloud SDK
        if: success() && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          # install_components: 'gke-gcloud-auth-plugin' # No longer needed as it's included in the Cloud SDK now 

      - name: Configure Docker for Artifact Registry
        if: success() && github.ref == 'refs/heads/main'
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet


      - name: Build and Push Docker image
        if: success() && github.ref == 'refs/heads/main'
        run: |
          # All values from secrets
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REPO="${{ secrets.GCP_ARTIFACT_REPO }}"
          REGION="${{ secrets.GCP_REGION }}"
          IMAGE_NAME="${{ secrets.DOCKER_IMAGE_NAME }}"
          TAG="${GITHUB_SHA::7}"
          LATEST_TAG="latest"
          
          FULL_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}"
          
          # Build and Push both tags
          # SINGLE BUILD with multiple tags
          docker build -t "${FULL_IMAGE}:${TAG}" \
                        -t "${FULL_IMAGE}:${LATEST_TAG}" .
          
          docker push "${FULL_IMAGE}:${TAG}"
          docker push "${FULL_IMAGE}:${LATEST_TAG}"
        env:
          DOCKER_BUILDKIT: 1

      # GKE Deployment (only on main)
      # Note: The GKE auth plugin is now included in the Cloud SDK, so we can skip the separate installation step.
      # - name: Install GKE auth plugin
      #   run: |
      #     gcloud components install gke-gcloud-auth-plugin --quiet

      # The gcloud command to get GKE credentials is now replaced with the google-github-actions/get-gke-credentials action, which simplifies the process and handles authentication seamlessly.
      # - name: Get GKE credentials
      # if: success() && github.ref == 'refs/heads/main'
      # run: gcloud container clusters get-credentials mlops-cluster \
      #   --region ${{ secrets.GCP_REGION }} \
      #   --project ${{ secrets.GCP_PROJECT_ID }}
      
      - name: Get GKE credentials
        if: success() && github.ref == 'refs/heads/main'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: mlops-cluster
          location: ${{ secrets.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Create Kubernetes Secret
        if: success() && github.ref == 'refs/heads/main'
        run: |
          kubectl create secret generic capstone-secret \
            --from-literal=CAPSTONE_TEST=${{ secrets.MLOPS_CAPS_PROJ_DAGS_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to GKE
        if: success() && github.ref == 'refs/heads/main'
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl rollout status deployment/capstone-app