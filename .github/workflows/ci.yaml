name: CI Pipeline

on: push

# jobs:
#   project-testing:
#     runs-on: ubuntu-latest

# name: CI Pipeline

# on: 
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      #Instead of installing all dependencies multiple time due to multiple run, to avoid this we take dependencies from cache and speed up execution after 1-2 execution.
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          CAPSTONE_TEST: ${{ secrets.MLOPS_CAPS_PROJ_DAGS_TOKEN }}
        run: |
          dvc repro

      - name: Run model tests
        env:
          CAPSTONE_TEST: ${{ secrets.MLOPS_CAPS_PROJ_DAGS_TOKEN }}
        run: |
          python -m unittest tests/test_model.py
      
      - name: Run Flask app tests # Moved UP before promotion
        if: success()
        env:
          CAPSTONE_TEST: ${{ secrets.MLOPS_CAPS_PROJ_DAGS_TOKEN }}
        run: python -m unittest tests/test_flask_app.py

      - name: Promote model to production
        if: success()
        env: #dag auth
          CAPSTONE_TEST: ${{ secrets.MLOPS_CAPS_PROJ_DAGS_TOKEN }}
        run: python scripts/promote_model.py

      ## GCP + Docker (only on main branch)
      - name: Authenticate to Google Cloud
        id: auth
        if: success() && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/177124743636/locations/global/workloadIdentityPools/github-pool/providers/github-provider-v2'
          service_account: 'mlops-930@mlops-499614.iam.gserviceaccount.com'
          
      - name: Set up Cloud SDK
        if: success() && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: success() && github.ref == 'refs/heads/main'
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

          
      - name: Build and Push Docker image
        if: success() && github.ref == 'refs/heads/main'
        run: |
          # All values from secrets
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REPO="${{ secrets.GCP_ARTIFACT_REPO }}"
          REGION="${{ secrets.GCP_REGION }}"
          IMAGE_NAME="${{ secrets.DOCKER_IMAGE_NAME }}"
          TAG="${GITHUB_SHA::7}"
          LATEST_TAG="latest"
          
          FULL_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}"
          
          # Build and Push both tags
          # SINGLE BUILD with multiple tags
          docker build -t "${FULL_IMAGE}:${TAG}" \
                        -t "${FULL_IMAGE}:${LATEST_TAG}" .
          
          docker push "${FULL_IMAGE}:${TAG}"
          docker push "${FULL_IMAGE}:${LATEST_TAG}"
        env:
          DOCKER_BUILDKIT: 1

      
